# ============================================
# 彩虹易支付 Nginx 配置（HTTP + HTTPS）
# ============================================

upstream php-upstream {
    server php:9000;
}

# 公共站点配置片段（由 include 使用需放 server 内，这里用 map 不便；改为两份 server 共用 include 文件）
# —— 实际配置在下方两个 server 中保持同步 ——

# HTTP：IP / 旧地址访问；监控 APP 的心跳与推送必须走明文 HTTP
server {
    listen 80;
    server_name pay.worldloom.top .worldloom.top _;
    root /var/www/html;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 50m;

    # 监控端接口：不要 301 到 HTTPS（官方/修复版 APP 使用 http://host/appPush）
    location ~ ^/gjb/([0-9]+)/(appHeart|appPush)$ {
        include fastcgi_params;
        fastcgi_pass php-upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/plugins/guajibao/monitor.php;
        fastcgi_param SCRIPT_NAME /gjb/$1/$2;
        fastcgi_param QUERY_STRING uid=$1&act=$2&$args;
        fastcgi_param PHP_VALUE "open_basedir=/var/www/html:/tmp/:/var/lib/php/sessions/";
    }

    location = /appHeart {
        include fastcgi_params;
        fastcgi_pass php-upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/plugins/guajibao/monitor.php;
        fastcgi_param SCRIPT_NAME /appHeart;
        fastcgi_param QUERY_STRING act=appHeart&$args;
        fastcgi_param PHP_VALUE "open_basedir=/var/www/html:/tmp/:/var/lib/php/sessions/";
    }

    location = /appPush {
        include fastcgi_params;
        fastcgi_pass php-upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/plugins/guajibao/monitor.php;
        fastcgi_param SCRIPT_NAME /appPush;
        fastcgi_param QUERY_STRING act=appPush&$args;
        fastcgi_param PHP_VALUE "open_basedir=/var/www/html:/tmp/:/var/lib/php/sessions/";
    }

    location = /user/guaji.php {
        include fastcgi_params;
        fastcgi_pass php-upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/plugins/guajibao/user_page.php;
        fastcgi_param SCRIPT_NAME /user/channel.php;
        fastcgi_param PHP_VALUE "open_basedir=/var/www/html:/tmp/:/var/lib/php/sessions/";
    }

    location = /user/channel.php {
        include fastcgi_params;
        fastcgi_pass php-upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/plugins/guajibao/user_page.php;
        fastcgi_param SCRIPT_NAME /user/channel.php;
        fastcgi_param PHP_VALUE "open_basedir=/var/www/html:/tmp/:/var/lib/php/sessions/";
    }

    location = /user/softdown.php {
        include fastcgi_params;
        fastcgi_pass php-upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/plugins/guajibao/download_page.php;
        fastcgi_param SCRIPT_NAME /user/softdown.php;
        fastcgi_param PHP_VALUE "open_basedir=/var/www/html:/tmp/:/var/lib/php/sessions/";
    }

    location = /gjb-upload.php {
        include fastcgi_params;
        fastcgi_pass php-upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/plugins/guajibao/upload.php;
        fastcgi_param SCRIPT_NAME /gjb-upload.php;
        fastcgi_param PHP_VALUE "open_basedir=/var/www/html:/tmp/:/var/lib/php/sessions/";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ^~ /includes { deny all; return 403; }
    location ^~ /plugins { deny all; return 403; }
    location ~* ^/install/.*\.(sql|lock)$ { deny all; return 403; }
    location ~* /(config\.php|\.htaccess|\.git) { deny all; return 403; }

    # 域名走 HTTP 时跳到 HTTPS；纯 IP 访问仍可用 HTTP（监控 APP 常用 IP）
    set $epay_https_redirect 0;
    if ($host ~* ^(pay\.)?worldloom\.top$) {
        set $epay_https_redirect 1;
    }
    if ($request_uri ~* ^/(appHeart|appPush|gjb/)) {
        set $epay_https_redirect 0;
    }
    if ($epay_https_redirect = 1) {
        return 301 https://pay.worldloom.top$request_uri;
    }

    location / {
        if (!-e $request_filename) {
            rewrite ^/(.[a-zA-Z0-9\-\_]+).html$ /index.php?mod=$1 last;
        }
        rewrite ^/pay/(.*)$ /pay.php?s=$1 last;
        rewrite ^/api/(.*)$ /api.php?s=$1 last;
        rewrite ^/doc/(.[a-zA-Z0-9\-\_]+).html$ /index.php?doc=$1 last;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php-upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "open_basedir=/var/www/html:/tmp/:/var/lib/php/sessions/";
        fastcgi_param HTTPS $https if_not_empty;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /assets/uploads/ {
        location ~* \.php$ { deny all; return 403; }
    }

    access_log /var/log/nginx/epay-access.log;
    error_log /var/log/nginx/epay-error.log;
}

# HTTPS：pay.worldloom.top
server {
    listen 443 ssl;
    http2 on;
    server_name pay.worldloom.top .worldloom.top;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/html;
    index index.php index.html;

    charset utf-8;
    client_max_body_size 50m;

    location ~ ^/gjb/([0-9]+)/(appHeart|appPush)$ {
